name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck, lint, and unit tests — no secrets needed, these never touch a
  # real database or external API.
  checks:
    runs-on: ubuntu-latest
    env:
      # prisma generate / tsc only need this to be a well-formed connection
      # string, they don't actually connect.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate

      - name: Generate Next.js route types
        # `LayoutProps`/`PageProps` etc. are generated by Next, not part of
        # the source — `next dev`/`next build` normally produce them as a
        # side effect, but CI type-checks without building. See
        # https://nextjs.org/docs/app/api-reference/cli/next#next-typegen-options
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm run test

  # Full-stack E2E tests against a production build. Needs real (dev/test
  # instance) secrets — see README.md's Testing section for the full list.
  #
  # The `secrets` context isn't allowed in a job-level `if:` (GitHub Actions
  # rejects the workflow file outright if you try), so this can't skip the
  # whole job that way. Instead every step below checks
  # `env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != ''` — `env` (unlike `secrets`)
  # is available in a step's `if:` — so the job "runs" but every step
  # no-ops until that secret (and presumably the others) is added under
  # Settings > Secrets and variables > Actions, rather than a fresh clone
  # showing a red CI run before secrets are configured.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      CI: true
    steps:
      - uses: actions/checkout@v5
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}

      - uses: actions/setup-node@v5
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}

      - run: npx prisma generate
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}

      - run: npx playwright install --with-deps chromium
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}

      - name: E2E tests
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() && env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
